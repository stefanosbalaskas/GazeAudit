title: GazeAudit
description: Measurement uncertainty and inferential robustness for eye-tracking research
url: https://stefanosbalaskas.github.io
baseurl: /GazeAudit
repository: stefanosbalaskas/GazeAudit
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty

plugins:
  - jekyll-github-metadata
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: false
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - .github
  - .gitignore
  - _site
  - src
  - tests
  - tools
  - release
  - pyproject.toml
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
