  example_url: /docs/examples/end-to-end-robustness/
  example_label: Audit context
  plot_url: /assets/plots/recovery-matrix.svg
  plot_label: Recovery matrix
  evidence_url: ""
  evidence_label: ""
  evidence_note: Synthetic known-truth benchmark by design; it is not a frozen real-data case study.
  keywords: benchmark known truth simulation recovery conclusion rule synthetic

