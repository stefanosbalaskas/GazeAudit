<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative specification curve</title>
  <desc id="desc">Ordered synthetic estimates across eighteen defensible specifications, all negative, with a zero reference line.</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fff}.panel{fill:#f7f9fc;stroke:#d9e0eb}.axis{stroke:#aeb8c8}.grid{stroke:#e4e9f1}.txt{fill:#22304a;font-family:Inter,system-ui,sans-serif}.muted{fill:#6d7a90}.pt{fill:#3b67dc}.pt2{fill:#7658d7}.zero{stroke:#b44a5e;stroke-width:2;stroke-dasharray:7 6}.band{fill:#466fda12}.line{fill:none;stroke:#476ed9;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    @media(prefers-color-scheme:dark){.bg{fill:#111a2a}.panel{fill:#162238;stroke:#31415c}.axis{stroke:#61708a}.grid{stroke:#26344b}.txt{fill:#edf3ff}.muted{fill:#a5b3c9}.zero{stroke:#ff8ca0}.band{fill:#7da2ff12}.line{stroke:#7da2ff}.pt{fill:#7da2ff}.pt2{fill:#b59cff}}
  </style>
  <rect class="bg" width="960" height="560" rx="26"/>
  <text class="txt" x="46" y="55" font-size="26" font-weight="750">Specification curve</text>
  <text class="muted" x="46" y="82" font-size="15">Synthetic illustration: order endpoint estimates across a declared specification space.</text>
  <rect class="panel" x="46" y="116" width="868" height="370" rx="18"/>
  <rect class="band" x="94" y="176" width="780" height="188" rx="12"/>
  <path class="grid" d="M94 176H874M94 239H874M94 302H874M94 365H874M94 428H874"/>
  <path class="axis" d="M94 150V446M94 446H874"/>
  <line class="zero" x1="94" y1="150" x2="874" y2="150"/>
  <text class="muted" x="84" y="155" text-anchor="end" font-size="12">0</text>
  <text class="muted" x="84" y="218" text-anchor="end" font-size="12">−0.1</text>
  <text class="muted" x="84" y="281" text-anchor="end" font-size="12">−0.2</text>
  <text class="muted" x="84" y="344" text-anchor="end" font-size="12">−0.3</text>
  <text class="muted" x="84" y="407" text-anchor="end" font-size="12">−0.4</text>
  <polyline class="line" points="112,401 155,389 198,382 241,370 284,359 327,350 370,340 413,332 456,320 499,309 542,300 585,287 628,274 671,261 714,247 757,231 800,215 843,198"/>
  <g>
    <circle class="pt" cx="112" cy="401" r="6"/><circle class="pt" cx="155" cy="389" r="6"/><circle class="pt" cx="198" cy="382" r="6"/><circle class="pt" cx="241" cy="370" r="6"/><circle class="pt" cx="284" cy="359" r="6"/><circle class="pt" cx="327" cy="350" r="6"/><circle class="pt" cx="370" cy="340" r="6"/><circle class="pt" cx="413" cy="332" r="6"/><circle class="pt" cx="456" cy="320" r="6"/><circle class="pt2" cx="499" cy="309" r="6"/><circle class="pt2" cx="542" cy="300" r="6"/><circle class="pt2" cx="585" cy="287" r="6"/><circle class="pt2" cx="628" cy="274" r="6"/><circle class="pt2" cx="671" cy="261" r="6"/><circle class="pt2" cx="714" cy="247" r="6"/><circle class="pt2" cx="757" cy="231" r="6"/><circle class="pt2" cx="800" cy="215" r="6"/><circle class="pt2" cx="843" cy="198" r="6"/>
  </g>
  <text class="muted" x="484" y="472" text-anchor="middle" font-size="13">Specifications ordered by estimate</text>
  <text class="muted" x="48" y="514" font-size="13">Illustrative data only. GazeAudit reports the declared specification space; it does not search for a preferred estimate.</text>
</svg>
