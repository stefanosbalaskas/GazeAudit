<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Pedrotti added-missingness recovery fractions</title>
  <desc id="desc">Recovery fractions by added missingness are 1.00, 1.00, 0.40, and 0.00 for MCAR at 1, 5, 10, and 20 percent, and 1.00, 0.55, 0.40, and 0.00 for single-block missingness at the same levels.</desc>
  <style>
    .bg{fill:#fff}.panel{fill:#f7f9fd;stroke:#d8dfeb;stroke-width:1.5}.grid{stroke:#e2e7f0;stroke-width:1}.axis{stroke:#6b778c;stroke-width:1.5}.mcar{fill:none;stroke:#2157d5;stroke-width:4}.block{fill:none;stroke:#6d55d9;stroke-width:4}.mcarp{fill:#2157d5}.blockp{fill:#6d55d9}.tick{fill:#667085;font:14px system-ui,sans-serif}.label{fill:#172033;font:600 16px system-ui,sans-serif}.small{fill:#60708a;font:14px system-ui,sans-serif}.legend{fill:#172033;font:600 14px system-ui,sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#111a2a}.panel{fill:#162238;stroke:#32415a}.grid{stroke:#26364f}.axis{stroke:#a5b3c9}.mcar{stroke:#7da2ff}.block{stroke:#a892ff}.mcarp{fill:#7da2ff}.blockp{fill:#a892ff}.tick,.small{fill:#a5b3c9}.label,.legend{fill:#edf3ff}}
  </style>
  <rect class="bg" width="900" height="500" rx="24"/>
  <rect class="panel" x="42" y="34" width="816" height="410" rx="20"/>
  <text class="label" x="78" y="75">Recovery under added missingness</text>
  <text class="small" x="78" y="101">Twenty deterministic replicates per frozen missingness family</text>

  <line class="grid" x1="120" y1="140" x2="800" y2="140"/>
  <line class="grid" x1="120" y1="195" x2="800" y2="195"/>
  <line class="grid" x1="120" y1="250" x2="800" y2="250"/>
  <line class="grid" x1="120" y1="305" x2="800" y2="305"/>
  <line class="grid" x1="120" y1="360" x2="800" y2="360"/>
  <line class="axis" x1="120" y1="140" x2="120" y2="380"/>
  <line class="axis" x1="120" y1="380" x2="800" y2="380"/>

  <text class="tick" x="103" y="145" text-anchor="end">1.0</text>
  <text class="tick" x="103" y="200" text-anchor="end">0.75</text>
  <text class="tick" x="103" y="255" text-anchor="end">0.50</text>
  <text class="tick" x="103" y="310" text-anchor="end">0.25</text>
  <text class="tick" x="103" y="365" text-anchor="end">0.0</text>

  <polyline class="mcar" points="175,140 350,140 525,272 700,360"/>
  <polyline class="block" points="175,140 350,239 525,272 700,360"/>
  <circle class="mcarp" cx="175" cy="140" r="8"/><circle class="mcarp" cx="350" cy="140" r="8"/><circle class="mcarp" cx="525" cy="272" r="8"/><circle class="mcarp" cx="700" cy="360" r="8"/>
  <circle class="blockp" cx="175" cy="140" r="5"/><circle class="blockp" cx="350" cy="239" r="8"/><circle class="blockp" cx="525" cy="272" r="5"/><circle class="blockp" cx="700" cy="360" r="5"/>

  <text class="tick" x="175" y="407" text-anchor="middle">1%</text>
  <text class="tick" x="350" y="407" text-anchor="middle">5%</text>
  <text class="tick" x="525" y="407" text-anchor="middle">10%</text>
  <text class="tick" x="700" y="407" text-anchor="middle">20%</text>
  <text class="small" x="460" y="435" text-anchor="middle">Added missingness</text>

  <line class="mcar" x1="590" y1="462" x2="620" y2="462"/><circle class="mcarp" cx="605" cy="462" r="6"/><text class="legend" x="630" y="467">MCAR within trial</text>
  <line class="block" x1="745" y1="462" x2="775" y2="462"/><circle class="blockp" cx="760" cy="462" r="6"/><text class="legend" x="785" y="467">single block</text>
</svg>
