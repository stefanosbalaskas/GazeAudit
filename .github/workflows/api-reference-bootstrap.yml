name: API reference bootstrap

on:
  push:
    branches:
      - docs/source-api-reference
    paths:
      - "tools/generate_api_symbol_reference.py"
      - ".github/workflows/api-reference-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/source-api-reference
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Generate canonical API symbol metadata
        run: python tools/generate_api_symbol_reference.py

      - name: Commit generated metadata
        run: |
          if git diff --quiet -- assets/api-symbol-reference.json && git ls-files --error-unmatch assets/api-symbol-reference.json >/dev/null 2>&1; then
            echo "API symbol metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/api-symbol-reference.json
          git commit -m "docs: add generated API symbol metadata"
          git push origin HEAD:docs/source-api-reference
