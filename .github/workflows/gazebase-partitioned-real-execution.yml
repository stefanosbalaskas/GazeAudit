name: GazeBase partitioned frozen real-data execution

on:
  push:
    branches:
      - validation/gazebase-partitioned-real-execution-v1

permissions:
  contents: read

env:
  SCIENTIFIC_COMMIT: 609203dfc37f2ef4984de82b888660e7cc30675c

concurrency:
  group: gazebase-partitioned-real-execution-v1
  cancel-in-progress: true

jobs:
  detector:
    name: detector-${{ matrix.detector }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        detector: [ivt, ivvt, idt, idvt, engbert, nh, remodnav]

    steps:
      - name: Initialize partition paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DETECTOR=${{ matrix.detector }}" >> "$GITHUB_ENV"
          echo "DATASET_ROOT=$RUNNER_TEMP/GazeBase-${{ matrix.detector }}" >> "$GITHUB_ENV"
          echo "PARTITION_ROOT=$RUNNER_TEMP/gazebase-partition-${{ matrix.detector }}" >> "$GITHUB_ENV"

      - name: Checkout exact certified scientific commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 609203dfc37f2ef4984de82b888660e7cc30675c
          fetch-depth: 1

      - name: Verify exact scientific commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SCIENTIFIC_COMMIT"
          mkdir -p "$PARTITION_ROOT/execution-envelope"
          printf '%s\n' "$actual" > "$PARTITION_ROOT/execution-envelope/scientific-commit.txt"
          printf '%s\n' "$DETECTOR" > "$PARTITION_ROOT/execution-envelope/detector.txt"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip

      - name: Install frozen case-study dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e '.[gazebase]'

      - name: Download and verify public GazeBase resource
        shell: bash
        run: |
          set -euo pipefail
          final_status=1
          for attempt in 1 2 3 4; do
            rm -rf "$DATASET_ROOT"
            mkdir -p "$DATASET_ROOT"
            set +e
            python - <<'PY' \
              > "$PARTITION_ROOT/execution-envelope/download-attempt-${attempt}.log" \
              2>&1
          import os
          from pathlib import Path
          import pymovements as pm

          root = Path(os.environ["DATASET_ROOT"])
          dataset = pm.Dataset("GazeBase", path=root)
          dataset.download()
          print("download_verified=true")
          PY
            status=$?
            set -e
            printf '%s\n' "$status" \
              > "$PARTITION_ROOT/execution-envelope/download-attempt-${attempt}-status.txt"
            if [ "$status" -eq 0 ]; then
              printf '%s\n' "$attempt" \
                > "$PARTITION_ROOT/execution-envelope/download-success-attempt.txt"
              final_status=0
              break
            fi
            sleep $((attempt * 20))
          done
          printf '%s\n' "$final_status" \
            > "$PARTITION_ROOT/execution-envelope/download-final-status.txt"
          if [ "$final_status" -ne 0 ]; then
            echo 'GazeBase download failed checksum verification after four attempts.' >&2
            exit 1
          fi

      - name: Capture pre-execution environment
        shell: bash
        run: |
          set -euo pipefail
          python -VV > "$PARTITION_ROOT/execution-envelope/python-version.txt" 2>&1
          python -m pip freeze --all > "$PARTITION_ROOT/execution-envelope/pip-freeze.txt"
          uname -a > "$PARTITION_ROOT/execution-envelope/uname.txt"
          cat /etc/os-release > "$PARTITION_ROOT/execution-envelope/os-release.txt"
          df -h > "$PARTITION_ROOT/execution-envelope/disk-before.txt"

      - name: Execute one frozen detector without exposing outcomes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$PARTITION_ROOT/scientific"
          (
            while true; do
              sleep 60
              echo "Frozen detector partition still running: $DETECTOR"
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          set +e
          python - <<'PY' \
            > "$PARTITION_ROOT/execution-envelope/runner-stdout.log" \
            2> "$PARTITION_ROOT/execution-envelope/runner-stderr.log"
          import os
          from pathlib import Path

          import pymovements as pm

          from gazeaudit import (
              prepare_gazebase_execution_context,
              prepare_gazebase_pymovements_dataset,
              run_gazebase_detector_partition_fail_closed,
              run_peyes_detector,
              write_gazebase_detector_partition,
          )

          dataset_root = Path(os.environ["DATASET_ROOT"])
          output_root = Path(os.environ["PARTITION_ROOT"])
          detector = os.environ["DETECTOR"]
          commit = os.environ["SCIENTIFIC_COMMIT"]

          dataset = pm.Dataset("GazeBase", path=dataset_root)
          dataset.load(
              participants=False,
              events=False,
              stimuli=False,
              subset={
                  "round_id": 1,
                  "session_id": 1,
                  "task_name": ["FXS", "TEX"],
              },
          )
          prepared = prepare_gazebase_pymovements_dataset(
              dataset,
              require_content_hash=True,
          )
          context = prepare_gazebase_execution_context(
              prepared,
              gazeaudit_commit=commit,
          )
          partition = run_gazebase_detector_partition_fail_closed(
              prepared,
              context,
              detector,
              detector_runner=run_peyes_detector,
          )
          write_gazebase_detector_partition(
              partition,
              output_root / "scientific" / "partition.json",
          )
          PY
          status=$?
          set -e
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT
          printf '%s\n' "$status" > "$PARTITION_ROOT/execution-envelope/runner-exit-status.txt"
          df -h > "$PARTITION_ROOT/execution-envelope/disk-after.txt"
          if [ "$status" -eq 0 ]; then
            python - <<'PY' \
              > "$PARTITION_ROOT/execution-envelope/verification.txt" \
              2>&1
          import os
          from pathlib import Path
          from gazeaudit import read_gazebase_detector_partition

          root = Path(os.environ["PARTITION_ROOT"])
          partition = read_gazebase_detector_partition(root / "scientific" / "partition.json")
          expected = os.environ["DETECTOR"]
          if partition.algorithm != expected:
              raise SystemExit(2)
          print("verified=true")
          PY
            verification_status=$?
            if [ "$verification_status" -ne 0 ]; then
              printf '%s\n' '2' > "$PARTITION_ROOT/execution-envelope/final-exit-status.txt"
              exit 0
            fi
          fi
          printf '%s\n' "$status" > "$PARTITION_ROOT/execution-envelope/final-exit-status.txt"

      - name: Checksum detector execution envelope
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PARTITION_ROOT"
          find execution-envelope scientific -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > PARTITION_SHA256SUMS

      - name: Archive detector partition before aggregation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gazebase-partition-${{ matrix.detector }}-609203df
          path: ${{ runner.temp }}/gazebase-partition-${{ matrix.detector }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Fail closed after detector archival
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "$PARTITION_ROOT/execution-envelope/final-exit-status.txt" 2>/dev/null || printf '99')"
          if [ "$status" != '0' ]; then
            echo "Frozen detector partition $DETECTOR failed with archived status $status" >&2
            exit "$status"
          fi

  aggregate:
    name: aggregate-after-seven-archives
    needs: detector
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Initialize aggregate paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DATASET_ROOT=$RUNNER_TEMP/GazeBase-aggregate" >> "$GITHUB_ENV"
          echo "DOWNLOAD_ROOT=$RUNNER_TEMP/gazebase-partition-downloads" >> "$GITHUB_ENV"
          echo "FINAL_ROOT=$RUNNER_TEMP/gazebase-partitioned-final" >> "$GITHUB_ENV"

      - name: Checkout exact certified scientific commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 609203dfc37f2ef4984de82b888660e7cc30675c
          fetch-depth: 1

      - name: Verify exact scientific commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SCIENTIFIC_COMMIT"
          mkdir -p "$FINAL_ROOT/execution-envelope"
          printf '%s\n' "$actual" > "$FINAL_ROOT/execution-envelope/scientific-commit.txt"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip

      - name: Install frozen case-study dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e '.[gazebase]'

      - name: Download and verify public GazeBase resource
        shell: bash
        run: |
          set -euo pipefail
          final_status=1
          for attempt in 1 2 3 4; do
            rm -rf "$DATASET_ROOT"
            mkdir -p "$DATASET_ROOT"
            set +e
            python - <<'PY' \
              > "$FINAL_ROOT/execution-envelope/download-attempt-${attempt}.log" \
              2>&1
          import os
          from pathlib import Path
          import pymovements as pm

          root = Path(os.environ["DATASET_ROOT"])
          dataset = pm.Dataset("GazeBase", path=root)
          dataset.download()
          print("download_verified=true")
          PY
            status=$?
            set -e
            printf '%s\n' "$status" \
              > "$FINAL_ROOT/execution-envelope/download-attempt-${attempt}-status.txt"
            if [ "$status" -eq 0 ]; then
              printf '%s\n' "$attempt" \
                > "$FINAL_ROOT/execution-envelope/download-success-attempt.txt"
              final_status=0
              break
            fi
            sleep $((attempt * 20))
          done
          printf '%s\n' "$final_status" \
            > "$FINAL_ROOT/execution-envelope/download-final-status.txt"
          if [ "$final_status" -ne 0 ]; then
            echo 'GazeBase download failed checksum verification after four attempts.' >&2
            exit 1
          fi

      - name: Download all seven archived detector partitions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gazebase-partition-*-609203df
          path: ${{ runner.temp }}/gazebase-partition-downloads
          merge-multiple: false

      - name: Capture aggregate environment
        shell: bash
        run: |
          set -euo pipefail
          python -VV > "$FINAL_ROOT/execution-envelope/python-version.txt" 2>&1
          python -m pip freeze --all > "$FINAL_ROOT/execution-envelope/pip-freeze.txt"
          uname -a > "$FINAL_ROOT/execution-envelope/uname.txt"
          cat /etc/os-release > "$FINAL_ROOT/execution-envelope/os-release.txt"
          find "$DOWNLOAD_ROOT" -type f -print | sort \
            > "$FINAL_ROOT/execution-envelope/downloaded-files.txt"

      - name: Aggregate frozen partitions without exposing outcomes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$FINAL_ROOT/scientific-artifacts"
          (
            while true; do
              sleep 60
              echo 'Frozen partition aggregation still running.'
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          set +e
          python - <<'PY' \
            > "$FINAL_ROOT/execution-envelope/runner-summary.json" \
            2> "$FINAL_ROOT/execution-envelope/runner-stderr.log"
          import os
          from pathlib import Path

          import pymovements as pm

          from gazeaudit import (
              GAZEBASE_DETECTORS,
              assemble_gazebase_partitioned_execution,
              canonical_json,
              prepare_gazebase_execution_context,
              prepare_gazebase_pymovements_dataset,
              read_gazebase_detector_partition,
              verify_gazebase_execution_artifacts,
              write_gazebase_execution_artifacts,
          )

          dataset_root = Path(os.environ["DATASET_ROOT"])
          download_root = Path(os.environ["DOWNLOAD_ROOT"])
          final_root = Path(os.environ["FINAL_ROOT"])
          commit = os.environ["SCIENTIFIC_COMMIT"]

          dataset = pm.Dataset("GazeBase", path=dataset_root)
          dataset.load(
              participants=False,
              events=False,
              stimuli=False,
              subset={
                  "round_id": 1,
                  "session_id": 1,
                  "task_name": ["FXS", "TEX"],
              },
          )
          prepared = prepare_gazebase_pymovements_dataset(
              dataset,
              require_content_hash=True,
          )
          context = prepare_gazebase_execution_context(
              prepared,
              gazeaudit_commit=commit,
          )

          partitions = []
          for detector in GAZEBASE_DETECTORS:
              path = (
                  download_root
                  / f"gazebase-partition-{detector}-609203df"
                  / "scientific"
                  / "partition.json"
              )
              partitions.append(read_gazebase_detector_partition(path))

          execution = assemble_gazebase_partitioned_execution(context, partitions)
          manifest = write_gazebase_execution_artifacts(
              execution,
              final_root / "scientific-artifacts",
          )
          if not verify_gazebase_execution_artifacts(final_root / "scientific-artifacts"):
              raise SystemExit(2)

          result = {
              "classification": str(execution.audit.summary["classification"]),
              "completeness_passed": bool(execution.audit.summary["completeness_passed"]),
              "execution_fingerprint": execution.execution_fingerprint,
              "artifact_manifest_fingerprint": manifest["artifact_manifest_fingerprint"],
              "publication_scientific_fingerprint": manifest[
                  "publication_scientific_fingerprint"
              ],
              "publication_bundle_fingerprint": manifest[
                  "publication_bundle_fingerprint"
              ],
          }
          print(canonical_json(result))
          PY
          status=$?
          set -e
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT
          printf '%s\n' "$status" > "$FINAL_ROOT/execution-envelope/runner-exit-status.txt"
          printf '%s\n' "$status" > "$FINAL_ROOT/execution-envelope/final-exit-status.txt"

      - name: Checksum complete aggregate envelope
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$FINAL_ROOT"
          find execution-envelope scientific-artifacts -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > FINAL_SHA256SUMS

      - name: Archive final aggregate before interpretation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gazebase-partitioned-final-609203df
          path: ${{ runner.temp }}/gazebase-partitioned-final
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Reveal archived scientific result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'The seven detector partitions and final aggregate have already been archived.'
          echo '--- runner-summary.json ---'
          cat "$FINAL_ROOT/execution-envelope/runner-summary.json" || true
          if [ -f "$FINAL_ROOT/scientific-artifacts/summary.json" ]; then
            echo '--- scientific-artifacts/summary.json ---'
            cat "$FINAL_ROOT/scientific-artifacts/summary.json"
          fi
          if [ -f "$FINAL_ROOT/scientific-artifacts/artifact_manifest.json" ]; then
            echo '--- scientific-artifacts/artifact_manifest.json ---'
            cat "$FINAL_ROOT/scientific-artifacts/artifact_manifest.json"
          fi
          echo '--- runner-stderr.log (tail) ---'
          tail -n 80 "$FINAL_ROOT/execution-envelope/runner-stderr.log" || true

      - name: Fail closed after final archival
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "$FINAL_ROOT/execution-envelope/final-exit-status.txt" 2>/dev/null || printf '99')"
          if [ "$status" != '0' ]; then
            echo "Frozen partition aggregation failed with archived status $status" >&2
            exit "$status"
          fi
