name: korthals-source-freeze

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korthals-source-freeze-v1
  cancel-in-progress: false

jobs:
  source-freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact GazeAudit commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify exact main execution identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > execution-commit.txt

      - name: Checkout frozen companion implementation
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/lukekorthals/pursuing-smooth-pursuits-data companion
          git -C companion checkout 1d7ebec23e3fe20f6db952eefda1a0dd58ae09da
          test "$(git -C companion rev-parse HEAD)" = "1d7ebec23e3fe20f6db952eefda1a0dd58ae09da"

      - name: Install exact execution stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ./companion

      - name: Download complete published OSF source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from eyemovement_data.utils import download_osf_data

          download_osf_data(
              raw_clean="both",
              train_test="both",
              participants="all",
              overwrite=False,
          )
          PY

      - name: Build endpoint-blind source intake
        shell: bash
        run: |
          set -euo pipefail
          gazeaudit-korthals-source-intake \
            --data-root data \
            --output-dir source-intake \
            > source-intake-status.txt

      - name: Capture dependency environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip freeze | LC_ALL=C sort > pip-freeze.txt
          test -s pip-freeze.txt

      - name: Build source-freeze envelope
        shell: bash
        run: |
          set -euo pipefail
          gazeaudit-korthals-source-freeze \
            --intake-dir source-intake \
            --output-dir korthals-source-freeze \
            --environment-file pip-freeze.txt \
            --execution-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            > source-freeze-status.json

      - name: Verify frozen source envelope before archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from gazeaudit.korthals_freeze import verify_korthals_source_freeze_artifacts

          if not verify_korthals_source_freeze_artifacts("korthals-source-freeze"):
              raise SystemExit("Korthals source-freeze verification failed")
          PY

      - name: Archive source freeze before reveal
        uses: actions/upload-artifact@v4
        with:
          name: korthals-source-freeze-${{ github.sha }}
          path: korthals-source-freeze/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Reveal archived source identity
        shell: bash
        run: |
          set -euo pipefail
          cat source-freeze-status.json
