name: bootstrap-api-symbol-reference-v2

on:
  push:
    branches:
      - docs/api-contract-cards
    paths:
      - "tools/generate_api_symbol_reference.py"
      - "assets/api-symbol-reference.json"
      - ".github/workflows/bootstrap-api-symbol-reference-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/api-contract-cards

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Regenerate API symbol reference
        run: python tools/generate_api_symbol_reference.py

      - name: Commit canonical metadata when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/api-symbol-reference.json; then
            echo "API symbol reference already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/api-symbol-reference.json
          git commit -m "docs: regenerate API symbol reference v2"
          git push origin HEAD:docs/api-contract-cards
