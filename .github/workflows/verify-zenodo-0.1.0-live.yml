name: verify-zenodo-0.1.0-live

on:
  pull_request:
    paths:
      - .github/workflows/verify-zenodo-0.1.0-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-zenodo-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact Zenodo-hosted v0.1.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://zenodo.org/records/22757340/files/gazeaudit-0.1.0.tar.gz?download=1'
          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            --user-agent 'GazeAudit/0.1.0 publication verifier' \
            "$url" \
            --output gazeaudit-0.1.0.tar.gz

      - name: Verify Zenodo payload size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          expected_size='242029'
          expected_sha256='8c449e2fc469c2b91f1c2471b674b5d6b16b6e6aa883289069ffb0a679517173'
          actual_size="$(stat --format='%s' gazeaudit-0.1.0.tar.gz)"
          actual_sha256="$(sha256sum gazeaudit-0.1.0.tar.gz | awk '{print $1}')"
          printf 'Zenodo file size: %s\n' "$actual_size"
          printf 'Zenodo SHA-256: %s\n' "$actual_sha256"
          test "$actual_size" = "$expected_size"
          test "$actual_sha256" = "$expected_sha256"
