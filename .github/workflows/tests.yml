name: tests

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest --cov=gazeaudit --cov-report=term-missing --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests tools/generate_api_symbol_reference.py

      - name: Generate API symbol metadata candidate
        run: python tools/generate_api_symbol_reference.py --output /tmp/api-symbol-reference.json

      - name: Upload API symbol metadata candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-symbol-reference-candidate
          path: /tmp/api-symbol-reference.json
          if-no-files-found: error
          retention-days: 1

      - name: Verify checked-in API symbol metadata
        run: cmp /tmp/api-symbol-reference.json assets/api-symbol-reference.json
