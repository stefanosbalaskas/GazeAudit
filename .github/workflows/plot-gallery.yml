name: plot-gallery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,plot]" "matplotlib==3.10.8"
      - name: Run readiness and plotting tests
        run: |
          pytest -q tests/test_readiness.py tests/test_plotting.py tests/test_plot_gallery_docs.py
      - name: Regenerate plot gallery
        run: python tools/generate_plot_gallery.py
      - name: Verify committed gallery is reproducible
        run: git diff --exit-code -- assets/plots
