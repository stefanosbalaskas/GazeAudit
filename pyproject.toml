[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gazeaudit"
version = "0.1.0.dev19"
description = "Measurement uncertainty and inferential robustness for eye-tracking research"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Stefanos Balaskas"}
]
keywords = [
  "eye-tracking",
  "gaze",
  "measurement-error",
  "uncertainty",
  "robustness",
  "multiverse-analysis",
  "AOI"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "numpy>=1.24",
  "packaging>=23",
  "pandas>=2.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5"
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6"
]
pymovements = [
  "pymovements>=0.28,<0.29"
]
peyes = [
  "peyes>=0.2.2,<0.3; python_version >= '3.12'"
]
interop = [
  "pymovements>=0.28,<0.29",
  "peyes>=0.2.2,<0.3; python_version >= '3.12'"
]
gazebase = [
  "pymovements==0.28.0",
  "peyes==0.2.2; python_version >= '3.12'"
]

[project.scripts]
gazeaudit-gazebase-run = "gazeaudit.gazebase_cli:main"
gazeaudit-korthals-source-intake = "gazeaudit.korthals_source_cli:main"
gazeaudit-korthals-source-freeze = "gazeaudit.korthals_freeze_cli:main"
gazeaudit-korthals-source-intake-v2 = "gazeaudit.korthals_source_v2_cli:main"
gazeaudit-korthals-source-freeze-v2 = "gazeaudit.korthals_freeze_v2_cli:main"
gazeaudit-pedrotti-source-intake = "gazeaudit.pedrotti_source_cli:main"
gazeaudit-pedrotti-source-freeze = "gazeaudit.pedrotti_freeze_cli:main"

[project.urls]
Homepage = "https://github.com/stefanosbalaskas/GazeAudit"
Repository = "https://github.com/stefanosbalaskas/GazeAudit"
Issues = "https://github.com/stefanosbalaskas/GazeAudit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gazeaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/gazeaudit/korthals_v2.py" = ["I001"]
